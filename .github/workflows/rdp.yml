name: RDP-Tailscale
on: workflow_dispatch
jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 0
          Set-Service TermService -StartupType Automatic
          Start-Service TermService
          New-NetFirewallRule -DisplayName "RDP-3389" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any
          Set-LocalUser -Name runneradmin -Password (ConvertTo-SecureString -AsPlainText "${{ secrets.RDP_PASSWORD }}" -Force)

      - name: Install tools
        run: choco install -y git

      - name: Install Tailscale as service
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "C:\ts.exe"
          Start-Process -FilePath "C:\ts.exe" -ArgumentList "/quiet" -Wait
          Set-Service -Name Tailscale -StartupType Automatic
          Start-Service Tailscale
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TS_AUTHKEY }} --hostname=gh-rdp --unattended

      - name: Show IP
        run: |
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: Setup project and autosave
        run: |
          git config --global user.email "alvino@gmail.com"
          git config --global user.name "Alvino33"
          git clone https://${{ secrets.GH_PAT }}@github.com/Alvino33/project-apk.git C:\project
          $script = @'
          cd C:\project
          while ($true) {
            git add .
            git commit -m "autosave $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")" -q 2>$null
            git push -q 2>$null
            Start-Sleep -Seconds 30
          }
          '@
          Set-Content -Path C:\autosave.ps1 -Value $script
          Start-Process powershell -ArgumentList "-ExecutionPolicy Bypass -File C:\autosave.ps1" -WindowStyle Minimized

      - name: Keep alive
        run: Start-Sleep -Seconds 21000
