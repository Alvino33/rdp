name: RDP-Windows
on: workflow_dispatch

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP and Create User
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force
          
          $password = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force
          if (Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue) { Remove-LocalUser -Name "rdpuser" }
          New-LocalUser -Name "rdpuser" -Password $password -PasswordNeverExpires -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser"

      - name: Install Tailscale
        shell: powershell
        run: |
          $out = "$env:TEMP\ts.exe"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/quiet" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --auth-key=${{ secrets.TS_AUTHKEY }} --hostname=gh-rdp-windows
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: Setup Project and Autosave
        shell: powershell
        run: |
          git config --global user.email "alvino@example.com"
          git config --global user.name "Alvino33"
          $projectPath = "C:\Users\Public\project"
          if (Test-Path $projectPath) { Remove-Item $projectPath -Recurse -Force }
          git clone "https://${{ secrets.GH_PAT }}@github.com/Alvino33/project-apk.git" $projectPath
          $autosave = 'cd "' + $projectPath + '"; while ($true) { git add .; git commit -m "autosave $(Get-Date -Format ''yyyy-MM-dd HH:mm:ss'')" 2>$null; git push 2>$null; Start-Sleep -Seconds 30 }'
          $autosave | Out-File -FilePath "C:\autosave.ps1" -Encoding UTF8
          Start-Process powershell -ArgumentList "-WindowStyle Hidden -ExecutionPolicy Bypass -File C:\autosave.ps1" -WindowStyle Hidden

      - name: Keep Alive
        shell: powershell
        run: Start-Sleep -Seconds 21000
