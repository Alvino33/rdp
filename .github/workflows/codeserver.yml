name: CodeServer
on: workflow_dispatch
jobs:
  codeserver:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install code-server
        run: curl -fsSL https://code-server.dev/install.sh | sh

      - name: Restore code-server config (extensions, theme, settings)
        run: |
          git clone https://${{ secrets.GH_PAT }}@github.com/Alvino33/codeserver-config.git /tmp/config-backup || true
          mkdir -p ~/.local/share/code-server
          mkdir -p ~/.config/code-server
          if [ -d /tmp/config-backup/extensions ]; then
            cp -r /tmp/config-backup/extensions ~/.local/share/code-server/
          fi
          if [ -d /tmp/config-backup/User ]; then
            cp -r /tmp/config-backup/User ~/.local/share/code-server/
          fi

      - name: Setup project
        run: |
          git config --global user.email "alvino@example.com"
          git config --global user.name "Alvino33"
          git clone https://${{ secrets.GH_PAT }}@github.com/Alvino33/project-apk.git /home/runner/project

      - name: Start autosave (project)
        run: |
          cat << 'EOF' > /home/runner/autosave.sh
          #!/bin/bash
          cd /home/runner/project
          while true; do
            git add .
            git commit -m "autosave $(date '+%Y-%m-%d %H:%M:%S')" -q
            git push -q
            sleep 30
          done
          EOF
          chmod +x /home/runner/autosave.sh
          nohup /home/runner/autosave.sh > /home/runner/autosave.log 2>&1 &

      - name: Start autosave (code-server config)
        run: |
          cat << 'EOF' > /home/runner/autosave-config.sh
          #!/bin/bash
          mkdir -p /tmp/config-backup
          cd /tmp/config-backup
          git init -q 2>/dev/null
          git remote add origin https://${{ secrets.GH_PAT }}@github.com/Alvino33/codeserver-config.git 2>/dev/null
          while true; do
            rsync -a --delete ~/.local/share/code-server/extensions/ /tmp/config-backup/extensions/ 2>/dev/null
            rsync -a --delete ~/.local/share/code-server/User/ /tmp/config-backup/User/ 2>/dev/null
            cd /tmp/config-backup
            git add .
            git commit -m "config autosave $(date '+%Y-%m-%d %H:%M:%S')" -q
            git push -q origin main 2>/dev/null
            sleep 60
          done
          EOF
          chmod +x /home/runner/autosave-config.sh
          nohup /home/runner/autosave-config.sh > /home/runner/autosave-config.log 2>&1 &

      - name: Start code-server
        env:
          PASSWORD: ${{ secrets.CODE_PASSWORD }}
        run: |
          code-server --bind-addr 0.0.0.0:8080 /home/runner/project > /home/runner/codeserver.log 2>&1 &
          sleep 5

      - name: Start Cloudflare Tunnel
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
          sleep 10
          echo "=========================================="
          echo "LINK AKSES CODE-SERVER:"
          grep -o 'https://[a-zA-Z0-9.-]*trycloudflare.com' tunnel.log
          echo "=========================================="

      - name: Keep alive
        run: sleep 21000
